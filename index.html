<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>🍁 메이플 파티 캘린더</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">

    databaseURL:       "https://maple-calendar-8df75-default-rtdb.firebaseio.com",
    projectId:         "maple-calendar-8df75",
    storageBucket:     "maple-calendar-8df75.firebasestorage.app",

  const db  = getDatabase(app);

<style>
/* ══════════════════════════════════════════
   DESIGN TOKENS
══════════════════════════════════════════ */
:root {
  --bg:       #08080f;
  --s1:       #0f0f1a;
  --s2:       #161624;
  --s3:       #1e1e30;
  --border:   #252540;
  --border2:  #32325a;
  --gold:     #f5a623;
  --gold2:    #ffd166;
  --orange:   #ff6b35;
  --text:     #eeeef5;
  --muted:    #6060a0;
  --muted2:   #9090c0;
  --green:    #3ecf8e;
  --red:      #f06060;
  --blue:     #60a0f5;
  --purple:   #a060f5;
  --r:        12px;
  --r2:       8px;
  --sh:       0 4px 24px rgba(0,0,0,.45);
  --sh2:      0 2px 10px rgba(0,0,0,.3);
}
/* ── 라이트 모드 ── */
body.light {
  --bg:       #f0f0f5;
  --s1:       #ffffff;
  --s2:       #f5f5fa;
  --s3:       #eaeaf0;
  --border:   #d8d8e8;
  --border2:  #c0c0d8;
  --text:     #1a1a2e;
  --muted:    #8888aa;
  --muted2:   #6666aa;
  --sh:       0 4px 24px rgba(0,0,0,.1);
  --sh2:      0 2px 10px rgba(0,0,0,.06);
}
body.light .app-header{background:rgba(240,240,245,.95);}
body.light .bottom-nav{background:rgba(240,240,245,.97);}
body.light .nick-modal{box-shadow:0 4px 32px rgba(0,0,0,.12);}
/* 테마 토글 버튼 */
.theme-toggle{
  background:var(--s2);border:1px solid var(--border2);
  border-radius:20px;padding:5px 10px;
  font-size:.8rem;color:var(--text);
  box-shadow:none;cursor:pointer;
  transition:all .2s;
}
.theme-toggle:hover{border-color:var(--gold);opacity:1;transform:none;filter:none;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{scroll-behavior:smooth;}
body{
  background:var(--bg);color:var(--text);
  font-family:'Noto Sans KR',sans-serif;
  min-height:100vh;min-height:100dvh;
  background-image:
    radial-gradient(ellipse at 15% 0%,rgba(245,166,35,.08) 0%,transparent 55%),
    radial-gradient(ellipse at 85% 100%,rgba(255,107,53,.06) 0%,transparent 55%);
  padding-bottom:env(safe-area-inset-bottom);
}

/* ══ SCROLLBAR ══ */
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:99px;}

/* ══ TYPOGRAPHY ══ */
.title-font{font-family:'Black Han Sans',sans-serif;}
.grad-text{
  background:linear-gradient(135deg,var(--gold2),var(--gold),var(--orange));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}

/* ══ BUTTONS ══ */
button{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  background:linear-gradient(135deg,var(--gold),var(--orange));
  border:none;border-radius:var(--r2);color:#0a0a12;
  cursor:pointer;font-family:'Black Han Sans',sans-serif;font-size:.88rem;
  padding:10px 18px;transition:filter .15s,transform .1s,opacity .15s;white-space:nowrap;
  box-shadow:0 2px 10px rgba(245,166,35,.25);
}
button:hover{filter:brightness(1.1);transform:translateY(-1px);}
button:active{transform:translateY(0);filter:brightness(.95);}
button:disabled{opacity:.35;cursor:not-allowed;transform:none;filter:none;}
.btn-ghost{
  background:var(--s2);color:var(--text);
  border:1px solid var(--border2);box-shadow:none;
}
.btn-ghost:hover{border-color:var(--gold);background:var(--s3);}
.btn-sm{padding:6px 12px;font-size:.76rem;border-radius:6px;}
.btn-danger{background:linear-gradient(135deg,var(--red),#c04040);color:#fff;box-shadow:none;}
.btn-full{width:100%;padding:13px;}
.btn-icon{padding:8px;border-radius:8px;aspect-ratio:1;}

/* ══ INPUTS ══ */
input[type=text],input[type=number],textarea,select{
  background:var(--s2);border:1.5px solid var(--border);
  border-radius:var(--r2);color:var(--text);
  font-family:'Noto Sans KR',sans-serif;font-size:.88rem;
  padding:10px 13px;outline:none;
  transition:border-color .2s,box-shadow .2s;width:100%;
}
input:focus,textarea:focus,select:focus{
  border-color:var(--gold);
  box-shadow:0 0 0 3px rgba(245,166,35,.12);
}
input::placeholder,textarea::placeholder{color:var(--muted);}
select option{background:var(--s2);}
.lbl{display:block;font-size:.75rem;color:var(--muted2);margin-bottom:5px;font-weight:500;}
.form-group{margin-bottom:14px;}
.form-row{display:flex;gap:10px;align-items:flex-end;}
.form-row>*{flex:1;}
.form-row>.shrink{flex:none;}

/* ══ CARD ══ */
.card{
  background:var(--s1);border:1px solid var(--border);
  border-radius:var(--r);padding:20px;
  box-shadow:var(--sh2);
}
.card+.card{margin-top:14px;}
.card-title{
  font-family:'Black Han Sans',sans-serif;font-size:.95rem;
  color:var(--gold);margin-bottom:16px;
  display:flex;align-items:center;gap:7px;
}
.card-title .badge{
  margin-left:auto;font-size:.68rem;
  background:rgba(245,166,35,.15);color:var(--gold);
  padding:2px 8px;border-radius:20px;
  font-family:'Noto Sans KR',sans-serif;font-weight:700;
}

/* ══ CHIPS ══ */
.chip{
  display:inline-flex;align-items:center;gap:4px;
  font-size:.7rem;padding:3px 9px;border-radius:20px;font-weight:600;
}
.chip-gold  {background:rgba(245,166,35,.15);color:var(--gold);}
.chip-green {background:rgba(62,207,142,.15);color:var(--green);}
.chip-red   {background:rgba(240,96,96,.15); color:var(--red);}
.chip-blue  {background:rgba(96,160,245,.15);color:var(--blue);}
.chip-purple{background:rgba(160,96,245,.15);color:var(--purple);}

/* ══ DIVIDER ══ */
.divider{height:1px;background:var(--border);margin:16px 0;}
.divider-text{
  display:flex;align-items:center;gap:12px;
  color:var(--muted);font-size:.75rem;margin:18px 0;
}
.divider-text::before,.divider-text::after{content:'';flex:1;height:1px;background:var(--border);}

/* ══ EMPTY STATE ══ */
.empty{
  text-align:center;color:var(--muted);
  padding:36px 20px;font-size:.85rem;line-height:1.8;
}
.empty .icon{font-size:2rem;display:block;margin-bottom:8px;}

/* ══ ERROR ══ */
.err-msg{font-size:.77rem;color:var(--red);margin-top:8px;min-height:18px;}

/* ══ SPINNER ══ */
.spin{
  display:inline-block;width:14px;height:14px;
  border:2px solid rgba(255,255,255,.15);border-top-color:var(--gold);
  border-radius:50%;animation:spinning .65s linear infinite;
}
@keyframes spinning{to{transform:rotate(360deg);}}

/* ══════════════════════════════════════════
   NICKNAME MODAL
══════════════════════════════════════════ */
.nick-modal-bg{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.75);backdrop-filter:blur(8px);
  z-index:300;align-items:center;justify-content:center;padding:20px;
}
.nick-modal-bg.open{display:flex;}
.nick-modal{
  background:var(--s1);border:1px solid var(--border2);
  border-radius:20px;padding:32px;width:100%;max-width:380px;
  text-align:center;box-shadow:var(--sh);
  animation:fadeUp .25s cubic-bezier(.34,1.2,.64,1);
}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
.nick-modal-logo{font-size:2.4rem;margin-bottom:8px;}
.nick-modal-title{
  font-family:'Black Han Sans',sans-serif;font-size:1.6rem;
  background:linear-gradient(135deg,var(--gold2),var(--orange));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  margin-bottom:6px;
}
.nick-modal-sub{color:var(--muted2);font-size:.8rem;margin-bottom:24px;line-height:1.6;}
.nick-modal-err{color:var(--red);font-size:.78rem;margin-top:8px;min-height:18px;}

/* ══════════════════════════════════════════
   APP SHELL
══════════════════════════════════════════ */
#appShell{display:block;}

/* ── TOP HEADER ── */
.app-header{
  display:flex;align-items:center;gap:12px;
  padding:12px 20px;
  background:rgba(8,8,15,.9);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:90;
}
.app-logo{
  font-family:'Black Han Sans',sans-serif;font-size:1.1rem;
  background:linear-gradient(135deg,var(--gold2),var(--orange));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  flex-shrink:0;
}
.room-pill{
  display:flex;align-items:center;gap:7px;
  background:var(--s2);border:1px solid var(--border2);
  border-radius:20px;padding:5px 13px;font-size:.75rem;cursor:pointer;
  transition:border-color .15s;
}
.room-pill:hover{border-color:var(--gold);}
.room-pill .code{
  font-family:'Black Han Sans',sans-serif;color:var(--gold);
  letter-spacing:2px;font-size:.88rem;
}
.header-right{margin-left:auto;display:flex;gap:8px;align-items:center;}
.online-dot{
  width:7px;height:7px;border-radius:50%;
  background:var(--green);box-shadow:0 0 6px var(--green);flex-shrink:0;
}

/* ── BOTTOM NAV (mobile-first) ── */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;z-index:90;
  background:rgba(8,8,15,.95);backdrop-filter:blur(16px);
  border-top:1px solid var(--border);
  display:flex;
  padding-bottom:env(safe-area-inset-bottom);
}
.nav-item{
  flex:1;display:flex;flex-direction:column;align-items:center;
  gap:3px;padding:10px 4px;cursor:pointer;
  font-size:.62rem;color:var(--muted);font-weight:600;
  transition:color .15s;border:none;background:none;border-radius:0;
  box-shadow:none;
}
.nav-item:hover{opacity:1;transform:none;filter:none;}
.nav-item.active{color:var(--gold);}
.nav-item .nav-icon{font-size:1.3rem;line-height:1;}
.nav-item .nav-dot{
  width:4px;height:4px;border-radius:50%;background:var(--gold);
  opacity:0;transition:opacity .15s;
}
.nav-item.active .nav-dot{opacity:1;}

/* ── PAGE CONTAINER ── */
.page{display:none;padding:16px 16px 80px;}
.page.active{display:block;}
@media(min-width:768px){
  .page{padding:24px 24px 32px;max-width:1100px;margin:0 auto;}
  .bottom-nav{display:none;}
  .desktop-nav{display:flex !important;}
}
.desktop-nav{
  display:none;
  background:var(--s1);border-bottom:1px solid var(--border);
  padding:0 24px;
}
.desktop-tab{
  font-family:'Black Han Sans',sans-serif;font-size:.88rem;
  padding:13px 18px;color:var(--muted);cursor:pointer;
  border-bottom:2px solid transparent;transition:all .2s;
  background:none;border-radius:0;box-shadow:none;
}
.desktop-tab:hover{color:var(--text);opacity:1;transform:none;filter:none;}
.desktop-tab.active{color:var(--gold);border-bottom-color:var(--gold);}

/* ══════════════════════════════════════════
   CALENDAR
══════════════════════════════════════════ */
.cal-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:14px;
}
.cal-month-title{
  font-family:'Black Han Sans',sans-serif;font-size:1.15rem;
  background:linear-gradient(135deg,var(--gold2),var(--gold));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.cal-nav{display:flex;gap:6px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.dow{
  text-align:center;font-size:.68rem;color:var(--muted);
  padding:6px 0;font-weight:700;letter-spacing:.3px;
}
.dow:first-child{color:var(--red);}
.dow:last-child{color:var(--blue);}
.cal-cell{
  min-height:80px;
  background:var(--s2);border:1px solid var(--border);
  border-radius:var(--r2);padding:5px;cursor:pointer;
  transition:border-color .15s,background .15s;
  position:relative;overflow:hidden;
}
@media(min-width:768px){.cal-cell{min-height:100px;}}
.cal-cell:hover{border-color:var(--gold);background:rgba(245,166,35,.04);}
.cal-cell.other{opacity:.3;}
.cal-cell.today{border-color:var(--gold);}
.cal-cell.today::after{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,var(--gold),var(--orange));
}
.cal-date{
  font-size:.75rem;font-weight:700;margin-bottom:3px;
  display:flex;align-items:center;justify-content:space-between;
}
.cal-date .dn{
  width:20px;height:20px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:.73rem;
}
.cal-cell.today .cal-date .dn{
  background:var(--gold);color:#0a0a12;
}
.cal-cell.sunday .cal-date .dn{color:var(--red);}
.cal-cell.saturday .cal-date .dn{color:var(--blue);}
.cal-events{display:flex;flex-direction:column;gap:2px;}
.ev-pill{
  font-size:.6rem;padding:2px 5px;border-radius:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  cursor:pointer;font-weight:600;
  font-family:'Noto Sans KR',sans-serif;
  letter-spacing:0;word-spacing:0;line-height:1.4;
  font-variant-numeric:tabular-nums;
  font-feature-settings:'tnum';
}
.ev-pill:hover{filter:brightness(1.2);}
.ev-more{font-size:.58rem;color:var(--muted2);padding:1px 3px;}

/* ── REPEAT ICON ── */
.repeat-icon{font-size:.58rem;opacity:.7;margin-left:2px;}

/* ── UPCOMING SIDEBAR ── */
.cal-layout{display:flex;flex-direction:column;gap:14px;}
@media(min-width:900px){
  .cal-layout{flex-direction:row;align-items:flex-start;}
  .cal-main{flex:1;}
  .cal-sidebar{width:270px;flex-shrink:0;}
}
.upcoming-item{
  display:flex;align-items:flex-start;gap:9px;
  padding:10px 12px;background:var(--s2);border:1px solid var(--border);
  border-radius:var(--r2);margin-bottom:7px;cursor:pointer;
  transition:border-color .15s;
}
.upcoming-item:hover{border-color:var(--gold);}
.ev-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:4px;}
.upcoming-info{flex:1;min-width:0;}
.upcoming-title{font-size:.82rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.upcoming-meta{font-size:.7rem;color:var(--muted2);margin-top:2px;}
.upcoming-del{
  background:none;border:none;color:var(--muted);
  padding:3px 6px;font-size:.85rem;border-radius:5px;
  box-shadow:none;align-self:center;flex-shrink:0;
}
.upcoming-del:hover{color:var(--red);background:rgba(240,96,96,.1);opacity:1;transform:none;filter:none;}

/* ══════════════════════════════════════════
   EVENT MODAL
══════════════════════════════════════════ */
.modal-bg{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.7);backdrop-filter:blur(6px);
  z-index:200;align-items:flex-end;justify-content:center;
}
@media(min-width:600px){.modal-bg{align-items:center;}}
.modal-bg.open{display:flex;}
.modal{
  background:var(--s1);border:1px solid var(--border2);
  border-radius:20px 20px 0 0;padding:24px;width:100%;
  max-width:500px;max-height:90vh;overflow-y:auto;
  animation:slideUp .25s cubic-bezier(.34,1.2,.64,1);
}
@media(min-width:600px){
  .modal{border-radius:16px;}
  @keyframes slideUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
}
@keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
.modal-handle{
  width:36px;height:4px;background:var(--border2);border-radius:2px;
  margin:0 auto 18px;
}
@media(min-width:600px){.modal-handle{display:none;}}
.modal-title{
  font-family:'Black Han Sans',sans-serif;font-size:1rem;
  color:var(--gold);margin-bottom:18px;
}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;}

/* ── EVENT TYPE CHIPS ── */
.type-row{display:flex;gap:7px;margin-bottom:14px;}
.type-chip{
  flex:1;padding:8px 4px;border-radius:8px;font-size:.78rem;
  border:1.5px solid var(--border);background:var(--s2);
  color:var(--muted2);cursor:pointer;text-align:center;
  font-family:'Black Han Sans',sans-serif;transition:all .15s;
}
.type-chip.t-boss  {border-color:var(--gold);color:var(--gold);background:rgba(245,166,35,.1);}
.type-chip.t-party {border-color:var(--green);color:var(--green);background:rgba(62,207,142,.1);}
.type-chip.t-memo  {border-color:var(--blue);color:var(--blue);background:rgba(96,160,245,.1);}

/* ── COLOR PICKER ── */
.color-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.color-swatch{
  width:26px;height:26px;border-radius:50%;cursor:pointer;
  border:2px solid transparent;transition:transform .15s,border-color .15s;
}
.color-swatch:hover{transform:scale(1.15);}
.color-swatch.sel{border-color:#fff;transform:scale(1.15);}

/* ── REPEAT ── */
.repeat-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.rep-chip{
  padding:5px 12px;border-radius:6px;font-size:.75rem;
  border:1.5px solid var(--border);background:var(--s2);
  color:var(--muted2);cursor:pointer;transition:all .15s;
  font-family:'Black Han Sans',sans-serif;
}
.rep-chip.sel-rep{border-color:var(--gold);color:var(--gold);background:rgba(245,166,35,.1);}

/* ══════════════════════════════════════════
   MEMBERS & CHARACTERS
══════════════════════════════════════════ */
.members-layout{display:flex;flex-direction:column;gap:16px;margin-top:16px;}
.member-section{
  background:var(--s1);border:1px solid var(--border);
  border-radius:var(--r);overflow:hidden;
}
.member-section.is-me{border-color:var(--gold);}
.member-section-header{
  display:flex;align-items:center;gap:10px;
  padding:12px 16px;background:var(--s2);
  border-bottom:1px solid var(--border);
}
.member-section-nick{
  font-family:'Black Han Sans',sans-serif;font-size:.95rem;color:var(--text);
}
.me-badge{
  font-size:.6rem;padding:2px 7px;border-radius:10px;
  background:rgba(245,166,35,.15);color:var(--gold);font-weight:700;
}
.char-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:10px;padding:12px;
}
.char-card{
  background:var(--s2);border:1.5px solid var(--border);
  border-radius:var(--r2);padding:12px;
  display:flex;flex-direction:column;gap:8px;
  position:relative;transition:border-color .15s;
}
.char-card:hover{border-color:var(--border2);}
.char-avatar-row{display:flex;align-items:center;gap:10px;}
.char-img{
  width:52px;height:52px;object-fit:contain;
  image-rendering:pixelated;border-radius:7px;
  background:var(--bg);flex-shrink:0;border:1px solid var(--border);
}
.char-img-ph{
  width:52px;height:52px;border-radius:7px;
  background:var(--s3);display:flex;align-items:center;
  justify-content:center;font-size:1.3rem;
  border:1px solid var(--border);flex-shrink:0;
}
.char-name{
  font-family:'Black Han Sans',sans-serif;font-size:.9rem;
  background:linear-gradient(135deg,var(--gold2),var(--orange));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.char-meta{font-size:.7rem;color:var(--muted2);line-height:1.7;margin-top:1px;}
.char-meta b{color:var(--text);}
.char-stat-row{
  display:flex;gap:6px;flex-wrap:wrap;
}
.char-stat{
  font-size:.67rem;padding:2px 7px;border-radius:10px;
  background:var(--s3);color:var(--muted2);
}
.char-stat b{color:var(--gold);}
.char-hexa-row{
  display:flex;align-items:center;gap:6px;
}
.char-hexa-input{
  width:80px;padding:4px 8px;font-size:.75rem;
  background:var(--bg);border:1px solid var(--border);
  border-radius:5px;color:var(--text);
}
.char-hexa-label{font-size:.7rem;color:var(--muted2);}
.char-equiv{
  font-family:'Black Han Sans',sans-serif;font-size:.8rem;
  color:var(--gold);
}
.char-del-btn{
  position:absolute;top:8px;right:8px;
  background:none;border:none;color:var(--muted);
  font-size:.8rem;padding:3px 6px;border-radius:4px;
  box-shadow:none;
}
.char-del-btn:hover{color:var(--red);background:rgba(240,96,96,.1);opacity:1;transform:none;filter:none;}
.add-char-btn{
  margin:0 12px 12px;width:calc(100% - 24px);
  background:var(--s3);color:var(--muted2);
  border:1.5px dashed var(--border2);
  box-shadow:none;font-size:.8rem;padding:9px;
}
.add-char-btn:hover{border-color:var(--gold);color:var(--gold);opacity:1;filter:none;}
.member-img{
  width:54px;height:54px;object-fit:contain;
  image-rendering:pixelated;border-radius:8px;
  background:var(--bg);flex-shrink:0;border:1px solid var(--border);
}
.member-img-ph{
  width:54px;height:54px;border-radius:8px;
  background:var(--s3);display:flex;align-items:center;
  justify-content:center;font-size:1.4rem;
  border:1px solid var(--border);flex-shrink:0;
}
/* 파티 선택 */
.party-selector{
  display:flex;align-items:center;gap:6px;margin-top:2px;flex-wrap:wrap;
}
.party-selector-label{font-size:.68rem;color:var(--muted2);}
.party-chip{
  font-size:.65rem;padding:2px 8px;border-radius:10px;
  border:1.5px solid var(--border);background:var(--s3);
  color:var(--muted2);cursor:pointer;transition:all .15s;
  font-family:'Black Han Sans',sans-serif;
}
.party-chip.sel{border-color:var(--gold);color:var(--gold);background:rgba(245,166,35,.12);}
.party-chip.p1{--pc:var(--gold);}
.party-chip.p2{--pc:#60a0f5;}
.party-chip.p3{--pc:#3ecf8e;}
.party-chip.p4{--pc:#a060f5;}
.party-chip.sel.p1{border-color:var(--gold);color:var(--gold);background:rgba(245,166,35,.12);}
.party-chip.sel.p2{border-color:#60a0f5;color:#60a0f5;background:rgba(96,160,245,.12);}
.party-chip.sel.p3{border-color:#3ecf8e;color:#3ecf8e;background:rgba(62,207,142,.12);}
.party-chip.sel.p4{border-color:#a060f5;color:#a060f5;background:rgba(160,96,245,.12);}

/* 파티 요약 카드 */
.party-summary-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-bottom:20px;
}
.party-summary-card{
  background:var(--s2);border:1px solid var(--border);
  border-radius:var(--r);padding:14px;
}
.party-summary-title{
  font-family:'Black Han Sans',sans-serif;font-size:.9rem;
  margin-bottom:10px;display:flex;align-items:center;gap:6px;
}
.party-count-badge{
  font-size:.65rem;padding:2px 7px;border-radius:10px;
  background:var(--s3);color:var(--muted2);
}
.party-member-list{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;}
.party-member-item{
  display:flex;align-items:center;justify-content:space-between;
  font-size:.75rem;padding:4px 8px;background:var(--s3);border-radius:6px;
}
.party-member-name{color:var(--text);font-weight:600;}
.party-member-equiv{color:var(--gold);font-family:'Black Han Sans',sans-serif;}
.party-scale-info{
  font-size:.72rem;color:var(--muted2);padding:8px;
  background:var(--bg);border-radius:6px;line-height:1.7;
}
.party-scale-val{color:var(--green);font-weight:700;}

/* 환산값 그리드 */
.equiv-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0;
}
.equiv-item{
  background:var(--s3);border-radius:7px;padding:7px 8px;text-align:center;
  border:1px solid var(--border);
}
.equiv-label{font-size:.62rem;color:var(--muted2);margin-bottom:2px;font-weight:600;}
.equiv-val{font-family:'Black Han Sans',sans-serif;font-size:.82rem;}
.equiv-val.cp   {color:var(--text);}
.equiv-val.e300 {color:var(--blue);}
.equiv-val.e380 {
  background:linear-gradient(135deg,var(--gold2),var(--orange));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}

/* 보스 테이블 */
.boss-table-wrap{margin-top:8px;}
.boss-tab-switch{display:flex;gap:6px;margin-bottom:8px;}
.boss-view-tab{
  flex:1;font-size:.72rem;padding:5px 0;border-radius:6px;
  background:var(--s3);color:var(--muted2);
  border:1.5px solid var(--border);font-family:'Black Han Sans',sans-serif;
  box-shadow:none;transition:all .15s;
}
.boss-view-tab:hover{border-color:var(--gold);color:var(--text);opacity:1;transform:none;filter:none;}
.boss-view-tab.on{
  background:linear-gradient(135deg,var(--gold),var(--orange));
  color:#0a0a12;border-color:transparent;
  box-shadow:0 2px 8px rgba(245,166,35,.2);
}
.boss-table{width:100%;border-collapse:collapse;font-size:.68rem;}
.boss-table th{
  text-align:left;padding:5px 7px;
  color:var(--muted2);font-weight:700;letter-spacing:.3px;
  border-bottom:1px solid var(--border);
  background:var(--bg);font-family:'Noto Sans KR',sans-serif;
}
.boss-table td{
  padding:4px 7px;border-bottom:1px solid rgba(255,255,255,.04);
  vertical-align:middle;
}
.boss-table tr:last-child td{border-bottom:none;}
.boss-table tr:hover td{background:rgba(255,255,255,.02);}
.boss-name-cell{display:flex;align-items:center;gap:5px;color:var(--text);}
.bf-badge{
  font-size:.6rem;padding:2px 6px;border-radius:8px;
  font-weight:700;white-space:nowrap;display:inline-block;
}
.bf-easy{background:rgba(62,207,142,.2);color:var(--green);}
.bf-ok  {background:rgba(96,160,245,.2);color:var(--blue);}
.bf-no  {background:rgba(240,96,96,.15);color:var(--red);}

/* ══════════════════════════════════════════
   BOSS RECOMMEND
══════════════════════════════════════════ */
.rec-summary{
  display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px;
}
.rec-stat{
  background:var(--s2);border:1px solid var(--border);border-radius:var(--r);
  padding:14px;text-align:center;
}
.rec-stat-val{
  font-family:'Black Han Sans',sans-serif;font-size:1.3rem;
  background:linear-gradient(135deg,var(--gold2),var(--orange));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.rec-stat-lbl{font-size:.7rem;color:var(--muted2);margin-top:2px;}
.rec-section{
  font-family:'Black Han Sans',sans-serif;font-size:.82rem;color:var(--muted2);
  margin:18px 0 8px;
  display:flex;align-items:center;gap:8px;
}
.rec-section::after{content:'';flex:1;height:1px;background:var(--border);}
.rec-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;}
.rec-card{
  background:var(--s2);border:1px solid var(--border);
  border-radius:var(--r);padding:14px;
  transition:border-color .15s,box-shadow .15s;
}
.rec-card.all-ok{border-color:rgba(62,207,142,.3);}
.rec-card.all-ok:hover{border-color:var(--green);box-shadow:0 0 0 1px rgba(62,207,142,.15);}
.rec-card:hover{border-color:var(--gold);}
.rec-boss-header{display:flex;align-items:center;gap:7px;margin-bottom:6px;}
.rec-boss-name{
  font-family:'Black Han Sans',sans-serif;font-size:.95rem;color:var(--text);
}
.rec-meso{
  font-family:'Black Han Sans',sans-serif;font-size:.82rem;
  color:var(--gold);margin-bottom:8px;
}
.rec-members{display:flex;flex-wrap:wrap;gap:4px;}
.rec-chip{font-size:.67rem;padding:2px 7px;border-radius:10px;font-weight:600;}
.rec-chip.ok{background:rgba(62,207,142,.15);color:var(--green);}
.rec-chip.no{background:rgba(240,96,96,.12);color:var(--red);}
.diff-badge{
  font-size:.6rem;padding:2px 6px;border-radius:4px;font-weight:700;
}
.diff-E{background:rgba(62,207,142,.2);color:var(--green);}
.diff-N{background:rgba(96,160,245,.2);color:var(--blue);}
.diff-H{background:rgba(255,107,53,.2);color:var(--orange);}
.diff-C{background:rgba(160,96,245,.2);color:var(--purple);}

/* ── WEEKLY MESO BAR ── */
.meso-bar-wrap{margin-top:8px;}
.meso-bar-lbl{display:flex;justify-content:space-between;font-size:.68rem;color:var(--muted2);margin-bottom:3px;}
.meso-bar{background:var(--s3);border-radius:3px;height:4px;overflow:hidden;}
.meso-bar-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--green),var(--gold));transition:width .4s;}

/* ══════════════════════════════════════════
   CALCULATOR
══════════════════════════════════════════ */
.calc-layout{display:flex;flex-direction:column;gap:14px;}
@media(min-width:768px){
  .calc-layout{flex-direction:row;align-items:flex-start;}
  .calc-left{flex:1;}
  .calc-right{flex:1;}
}
.boss-tab-row{display:flex;gap:7px;margin-bottom:12px;}
.boss-tab{
  flex:1;padding:8px;font-size:.82rem;border-radius:8px;
  background:var(--s2);color:var(--muted2);
  border:1.5px solid var(--border);
  transition:all .15s;font-family:'Black Han Sans',sans-serif;
  box-shadow:none;
}
.boss-tab:hover{border-color:var(--gold);color:var(--text);opacity:1;transform:none;filter:none;}
.boss-tab.on{
  background:linear-gradient(135deg,var(--gold),var(--orange));
  color:#0a0a12;border-color:transparent;
  box-shadow:0 2px 10px rgba(245,166,35,.25);
}
.boss-sel-row{display:flex;gap:7px;margin-bottom:10px;}
.boss-sel-row button{
  font-family:'Noto Sans KR',sans-serif;font-size:.74rem;
  padding:5px 10px;background:var(--s2);color:var(--text);
  border:1px solid var(--border);box-shadow:none;
}
.boss-sel-row button:hover{border-color:var(--gold);opacity:1;filter:none;}
.boss-sec-lbl{
  font-size:.68rem;color:var(--muted);letter-spacing:.4px;
  text-transform:uppercase;margin:10px 0 5px;font-weight:700;
}
.boss-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;}
@media(max-width:400px){.boss-grid{grid-template-columns:1fr;}}
.boss-item{
  display:flex;align-items:center;gap:8px;
  background:var(--s2);border:1.5px solid var(--border);
  border-radius:8px;padding:8px 10px;cursor:pointer;
  user-select:none;transition:border-color .15s,background .15s;
  position:relative;overflow:hidden;
}
.boss-item::before{
  content:'';position:absolute;left:0;top:0;bottom:0;
  width:3px;background:transparent;border-radius:8px 0 0 8px;
}
.boss-item.on{border-color:var(--gold);background:rgba(245,166,35,.06);}
.boss-item.on::before{background:linear-gradient(180deg,var(--gold),var(--orange));}
.boss-chk{
  width:16px;height:16px;border-radius:4px;
  border:1.5px solid var(--border2);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:.65rem;transition:all .15s;
}
.boss-item.on .boss-chk{background:var(--gold);border-color:var(--gold);color:#0a0a12;}
.boss-lbl{flex:1;min-width:0;}
.boss-nm{font-size:.76rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.boss-ms{font-size:.66rem;color:var(--muted2);}
.boss-item.on .boss-ms{color:var(--gold2);}
.diff{font-size:.58rem;padding:2px 5px;border-radius:3px;font-weight:700;flex-shrink:0;}
.diff.E{background:rgba(62,207,142,.2);color:var(--green);}
.diff.N{background:rgba(96,160,245,.2);color:var(--blue);}
.diff.H{background:rgba(255,107,53,.2);color:var(--orange);}
.diff.C{background:rgba(160,96,245,.2);color:var(--purple);}
.weekly-total-row{
  display:flex;justify-content:space-between;align-items:center;
  background:var(--s2);border:1px solid var(--border2);
  border-radius:var(--r2);padding:11px 13px;margin-top:10px;
}
.wt-val{
  font-family:'Black Han Sans',sans-serif;font-size:.95rem;
  background:linear-gradient(135deg,var(--gold2),var(--orange));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.meso-hint{
  font-family:'Black Han Sans',sans-serif;font-size:.88rem;
  color:var(--gold);margin-top:4px;min-height:18px;
}
.result-box{
  background:linear-gradient(135deg,rgba(245,166,35,.08),rgba(255,107,53,.06));
  border:1px solid rgba(245,166,35,.25);border-radius:var(--r);
  padding:24px;text-align:center;margin-top:14px;
}
.result-weeks{
  font-family:'Black Han Sans',sans-serif;
  font-size:clamp(2rem,10vw,3.5rem);line-height:1;
  background:linear-gradient(135deg,var(--gold2),var(--orange));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.result-sub{font-size:.82rem;color:var(--muted2);margin:6px 0 16px;}
.prog-wrap{background:var(--s2);border-radius:6px;height:8px;overflow:hidden;margin-bottom:16px;}
.prog-fill{
  height:100%;border-radius:6px;
  background:linear-gradient(90deg,var(--gold),var(--orange));
  transition:width .6s ease;
}
.result-stats{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;}
.rs-item{text-align:center;}
.rs-val{font-family:'Black Han Sans',sans-serif;font-size:1rem;color:var(--text);}
.rs-lbl{font-size:.68rem;color:var(--muted2);}

/* ══ TOAST ══ */
.toast{
  position:fixed;bottom:80px;left:50%;
  transform:translateX(-50%) translateY(20px);opacity:0;
  background:var(--s2);border:1px solid var(--border2);
  border-radius:10px;padding:11px 20px;font-size:.83rem;
  box-shadow:var(--sh);z-index:999;
  transition:transform .25s ease,opacity .25s ease;
  pointer-events:none;white-space:nowrap;
}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
@media(min-width:768px){.toast{bottom:28px;}}

/* ══ API NOTICE ══ */
.api-notice{
  font-size:.73rem;color:var(--muted2);line-height:1.7;
  padding:9px 12px;background:rgba(245,166,35,.05);
  border:1px solid rgba(245,166,35,.12);border-radius:8px;margin-bottom:12px;
}
.api-notice a{color:var(--gold);text-decoration:none;}
.api-notice a:hover{text-decoration:underline;}
</style>
</head>
<body>

<!-- ════════════════ NICKNAME MODAL ════════════════ -->
<div class="nick-modal-bg" id="nickModal">
  <div class="nick-modal">
    <div class="nick-modal-logo">🍁</div>
    <div class="nick-modal-title">메이플 파티 캘린더</div>
    <p class="nick-modal-sub">파티원과 보스 일정을 공유하고<br>최적 보스를 함께 추천받아요</p>
    <div class="form-group">
      <label class="lbl">닉네임을 입력해주세요</label>
      <input type="text" id="nickInput" placeholder="예: 정훈이" maxlength="10"
        onkeydown="if(event.key==='Enter')submitNick()">
    </div>
    <button class="btn-full" onclick="submitNick()">🍁 시작하기</button>
    <div class="nick-modal-err" id="nickErr"></div>
  </div>
</div>

<!-- ════════════════ APP ════════════════ -->
<div id="appShell">

  <!-- TOP HEADER -->
  <div class="app-header">
    <div class="app-logo">🍁 파티 캘린더</div>
    <div class="room-pill" onclick="copyLink()">
      <span class="online-dot"></span>
      <span style="color:var(--muted2);font-size:.72rem;">방</span>
      <span class="code" id="roomCodeDisp">------</span>
    </div>
    <div class="header-right">
      <button class="theme-toggle" id="themeBtn" onclick="toggleTheme()">🌙</button>
      <button class="btn-ghost btn-sm" onclick="copyLink()">🔗 공유</button>
      <button class="btn-ghost btn-sm" onclick="openNickModal()">✏️ 닉네임</button>
    </div>
  </div>

  <!-- DESKTOP NAV -->
  <div class="desktop-nav">
    <button class="desktop-tab active" onclick="goPage('calPage',this)">📅 캘린더</button>
    <button class="desktop-tab" onclick="goPage('membersPage',this)">👥 파티원</button>
    <button class="desktop-tab" onclick="goPage('recPage',this);renderRec()">🗺 보스 추천</button>
    <button class="desktop-tab" onclick="goPage('calcPage',this)">📊 계산기</button>
  </div>

  <!-- PAGES -->
  <div id="calPage" class="page active">
    <div class="cal-layout">
      <div class="cal-main">
        <div class="cal-header">
          <div class="cal-nav">
            <button class="btn-ghost btn-sm btn-icon" onclick="chMonth(-1)">◀</button>
            <button class="btn-ghost btn-sm" onclick="goToday()" style="font-size:.75rem;">오늘</button>
          </div>
          <div class="cal-month-title" id="calTitle"></div>
          <button class="btn-ghost btn-sm btn-icon" onclick="chMonth(1)">▶</button>
        </div>
        <div class="cal-grid" id="calGrid"></div>
      </div>
      <div class="cal-sidebar">
        <div class="card-title" style="font-family:'Black Han Sans',sans-serif;font-size:.88rem;color:var(--gold);margin-bottom:10px;">
          📋 다가오는 일정
        </div>
        <div id="upcomingList"><div class="empty"><span class="icon">📭</span>다가오는 일정이 없어요</div></div>
      </div>
    </div>
  </div>

  <div id="membersPage" class="page">
    <!-- 내 캐릭터 추가 카드 -->
    <div class="card">
      <div class="card-title">🔑 캐릭터 추가</div>
      <div class="api-notice">
        캐릭터명을 입력하면 레벨, 직업, 헥사스탯, 환산주스탯이 자동으로 불러와져요 🍁
      </div>
      <div class="form-row" style="gap:10px;">
        <div style="flex:1;">
          <label class="lbl">캐릭터명</label>
          <input type="text" id="charNameInput" placeholder="캐릭터명 입력"
            onkeydown="if(event.key==='Enter')registerChar()">
        </div>
        <div class="shrink" style="padding-top:20px;">
          <button id="regBtn" onclick="registerChar()">추가</button>
        </div>
      </div>
      <div class="err-msg" id="charErr"></div>
    </div>
    <!-- 파티원 목록 -->
    <div class="members-layout" id="membersGrid">
      <div class="empty"><span class="icon">👥</span>캐릭터를 추가해주세요</div>
    </div>
  </div>

  <div id="recPage" class="page">
    <div id="recContent">
      <div class="empty"><span class="icon">🗺</span>파티원 탭에서 캐릭터를 먼저 등록해주세요</div>
    </div>
  </div>

  <div id="calcPage" class="page">
    <div class="calc-layout">
      <div class="calc-left">
        <div class="card">
          <div class="card-title">🎯 목표 메소 설정</div>
          <div class="form-group">
            <label class="lbl">목표 메소 (억 단위)</label>
            <input type="number" id="targetInput" placeholder="예: 500 → 500억" min="1" oninput="onTInput()">
            <div class="meso-hint" id="targetHint"></div>
          </div>
          <div class="form-group">
            <label class="lbl">현재 보유 메소 (억 단위)</label>
            <input type="number" id="currentInput" placeholder="예: 50 → 50억 (없으면 0)" min="0" oninput="onTInput()">
          </div>
          <button class="btn-full" onclick="calc()">📊 계산하기</button>
        </div>
        <div class="result-box" id="resultBox" style="display:none;">
          <div class="result-weeks" id="resultW"></div>
          <div class="result-sub" id="resultSub"></div>
          <div class="prog-wrap"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
          <div class="result-stats" id="resultStats"></div>

const fb=()=>window._fb;

}

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5);}
function code6(){return Math.random().toString(36).slice(2,8).toUpperCase();}

// 닉네임 모달 열기/닫기
function openNickModal(){document.getElementById('nickModal').classList.add('open');}

async function submitNick(){
  const nick=document.getElementById('nickInput').value.trim();
  if(!nick){document.getElementById('nickErr').textContent='닉네임을 입력해주세요';return;}
  myNick=nick;
  localStorage.setItem('maple_nick',myNick);
  // myUid가 없으면 새로 생성
  if(!myUid){ myUid=uid(); localStorage.setItem('maple_uid',myUid); }
  // 방이 없으면 새로 생성
  if(!roomCode){
    const code=code6();
    await fbSet(`rooms/${code}/meta`,{at:Date.now()});
    roomCode=code;
  }
  await fbSet(`rooms/${roomCode}/members/${myUid}`,{nickname:myNick});
  closeNickModal();
  // enterApp으로 Firebase 리스너 등록 (캘린더 실시간 동기화 핵심)
  enterApp(roomCode);
  toast('👋 환영해요, '+myNick+'!');
}

function enterApp(code){
  roomCode=code;
  document.getElementById('roomCodeDisp').textContent=code;
  if(!calY){ const now=new Date(); calY=now.getFullYear(); calM=now.getMonth(); }
  const url=new URL(location.href);
  url.searchParams.set('room',code);
  history.replaceState({},'',url);
  localStorage.setItem('maple_room',code);
  localStorage.setItem('maple_nick',myNick);
  localStorage.setItem('maple_uid',myUid);
  fbUnsubs.forEach(u=>u()); fbUnsubs=[];
  fbOn(`rooms/${code}/events`,v=>{events=v||{};renderCal();renderUpcoming();});
  fbOn(`rooms/${code}/members`,v=>{members=v||{};renderMembers();});
  renderCal();
  renderBossList();
  buildColorRow();
  // 테마 초기화
  initTheme();
  // 마지막 활성 탭 복원
  const lastTab=localStorage.getItem('maple_tab');
  if(lastTab){
    const tabMap={
      'calPage':     {pageId:'calPage',    navId:'cal'},
      'membersPage': {pageId:'membersPage',navId:'mem'},
      'recPage':     {pageId:'recPage',    navId:'rec'},
      'calcPage':    {pageId:'calcPage',   navId:'calc'},

    const t=tabMap[lastTab];
    if(t){
      goPage(t.pageId, null, t.navId);
      if(lastTab==='recPage') renderRec();
    }

}

window.addEventListener('firebase-ready',async()=>{
  const urlCode=new URLSearchParams(location.search).get('room');
  const savedCode=localStorage.getItem('maple_room');
  const savedNick=localStorage.getItem('maple_nick');
  const savedUid =localStorage.getItem('maple_uid');

  // 사용할 방 코드 결정: URL 우선, 없으면 저장된 코드, 없으면 새로 생성
  const targetCode = urlCode || savedCode || null;

  if(targetCode && savedNick && savedUid){
    // 닉네임·uid 있으면 바로 입장
    const meta=await fbGet(`rooms/${targetCode}/meta`);
    if(meta){
      myNick=savedNick; myUid=savedUid;
      const existing=await fbGet(`rooms/${targetCode}/members/${savedUid}`);
      if(!existing) await fbSet(`rooms/${targetCode}/members/${savedUid}`,{nickname:savedNick});
      enterApp(targetCode);
      if(urlCode && urlCode!==savedCode) toast(`👋 초대 링크로 입장했어요!`);
      return;
    }
    // 방이 없어진 경우 → 새 방 자동 생성 후 입장
    localStorage.removeItem('maple_room');
  }

  if(savedNick && savedUid){
    // 닉네임은 있는데 방이 없는 경우 → 새 방 생성
    myNick=savedNick; myUid=savedUid;
    const code=code6();
    await fbSet(`rooms/${code}/meta`,{at:Date.now()});
    await fbSet(`rooms/${code}/members/${myUid}`,{nickname:myNick});
    enterApp(code);
    return;
  }

  // 닉네임 없는 경우 → 닉네임 모달 표시

// expand repeat events for display
function expandedEvents(){
  const out={};
  const today=new Date(); today.setHours(0,0,0,0);
  const rangeStart=new Date(calY,calM-1,1);
  const rangeEnd=new Date(calY,calM+2,0);

  Object.entries(events).forEach(([date,dayEvs])=>{
    Object.entries(dayEvs||{}).forEach(([id,ev])=>{
      const addTo=(d)=>{
        const ds=fmtDate(d);
        if(!out[ds]) out[ds]={};
        out[ds][id+'_'+ds]={...ev,_origId:id,_origDate:date};
      };
      const orig=new Date(date+'T00:00:00');
      addTo(orig);
      if(ev.repeat==='weekly'){
        for(let i=1;i<=52;i++){
          const d=new Date(orig); d.setDate(d.getDate()+7*i);
          if(d>rangeEnd) break;
          if(d>=rangeStart) addTo(d);
        }
      } else if(ev.repeat==='monthly'){
        for(let i=1;i<=24;i++){
          const d=new Date(orig); d.setMonth(d.getMonth()+i);
          if(d>rangeEnd) break;
          if(d>=rangeStart) addTo(d);
        }
      } else if(ev.repeat==='yearly'){
        for(let i=1;i<=5;i++){
          const d=new Date(orig); d.setFullYear(d.getFullYear()+i);
          if(d>rangeEnd) break;
          if(d>=rangeStart) addTo(d);
        }
      }
    });
  });
  return out;
}

function renderCal(){
  document.getElementById('calTitle').textContent=`${calY}년 ${calM+1}월`;
  const grid=document.getElementById('calGrid');
  grid.innerHTML='';
  ['일','월','화','수','목','금','토'].forEach(d=>{
    const el=document.createElement('div');
    el.className='dow'; el.textContent=d; grid.appendChild(el);
  });
  const first=new Date(calY,calM,1).getDay();
  const dim=new Date(calY,calM+1,0).getDate();
  const dipm=new Date(calY,calM,0).getDate();
  const today=new Date(); today.setHours(0,0,0,0);
  const expanded=expandedEvents();

  for(let i=0;i<42;i++){
    let day,other=false,ds;
    if(i<first){day=dipm-first+1+i;other=true;ds=fmtDate(new Date(calY,calM-1,day));}
    else if(i>=first+dim){day=i-first-dim+1;other=true;ds=fmtDate(new Date(calY,calM+1,day));}
    else{day=i-first+1;ds=fmtDate(new Date(calY,calM,day));}

    const dow=i%7;
    const isToday=!other&&new Date(calY,calM,day).getTime()===today.getTime();
    const cell=document.createElement('div');
    cell.className='cal-cell'+(other?' other':'')+(isToday?' today':'')+(dow===0?' sunday':'')+(dow===6?' saturday':'');
    cell.onclick=()=>openAddModal(ds);

    const dateDiv=document.createElement('div');
    dateDiv.className='cal-date';
    dateDiv.innerHTML=`<span class="dn">${day}</span>`;
    cell.appendChild(dateDiv);

    const evWrap=document.createElement('div');
    evWrap.className='cal-events';
    const dayEvs=Object.entries(expanded[ds]||{});
    dayEvs.slice(0,3).forEach(([eid,ev])=>{

//  PARTY SCALE (인원별 보스 데미지 배율)
//  파티원이 많을수록 보스 HP 증가 → 요구 스탯 증가
//  솔플=1.0 기준, n명 파티 시 개인 기여도 기준 환산
// ════════════════════════════════════════════
const PARTY_SCALE = {1:1.0, 2:0.65, 3:0.5, 4:0.42};

// ── 주간보스 12마리 최적 조합 추천 ──
// n명 파티의 equivStat으로 클리어 가능한 보스 중 메소 수익 상위 12개 선택
function getBossRecommendation(chars, partyNo){
  const n = Math.min(chars.length, 4);
  const scale = PARTY_SCALE[n] || 0.42;
  const totalEquiv = chars.reduce((s,ch)=>s+(ch.equivStat||0), 0);

  // 클리어 가능한 주간보스만 필터 (여유 or 가능)
  const possible = BOSSES
    .filter(b => b.cycle==='weekly')
    .filter(b => {
      const f = getPartyBossFeasibility(chars, b.id);
      return f==='easy' || f==='ok';
    })
    .sort((a,b) => b.meso - a.meso); // 메소 내림차순

  // 상위 12개 선택 (주간보스 최대 클리어 횟수)
  const top12 = possible.slice(0, 12);
  const totalMeso = top12.reduce((s,b)=>s+b.meso, 0);

  return { chars, n, scale, totalEquiv, top12, totalMeso };
}

// 파티번호별 캐릭터 집계 (members 기반)
function getPartyGroups(){
  const groups = {1:[],2:[],3:[],4:[]};
  Object.values(members).forEach(m=>{
    Object.values(m.chars||{}).forEach(ch=>{
      const p = ch.partyNo||1;
      if(groups[p]) groups[p].push({...ch, ownerNick:m.nickname});
    });
  });
  return groups;
}

// 특정 파티의 보스 가능여부 계산
function getPartyBossFeasibility(chars, bossId){
  if(!chars.length) return null;
  const n = Math.min(chars.length, 4);
  const scale = PARTY_SCALE[n]||0.42;
  const th = BOSS_THRESHOLDS[bossId];
  if(!th) return null;
  // 파티원 전체 환산주스탯 합산 × 배율
  const totalEquiv = chars.reduce((s,ch)=>s+(ch.equivStat||0),0);
  const effectiveEquiv = totalEquiv * scale;
  const t = n===1 ? th.solo : th.party;
  if(effectiveEquiv >= t.easy) return 'easy';
  if(effectiveEquiv >= t.ok)   return 'ok';
  return 'no';
}

// ════════════════════════════════════════════
//  EQUIV STAT 계산 (환산주스탯)
//  넥슨 API stat_list에서 주스탯, 부스탯, 공/마력, 보스데미지% 추출
// ════════════════════════════════════════════
// ════════════════════════════════════════════
//  환산주스탯 계산 (역산 검증 공식)
//  환산(380) = 최대스탯공/10000 × (1+보공%) / 남은방어율
//  남은방어율 = 1 - (보스방어율/100)×(1-방무/100)
//  헥사환산(380) = 환산(380) + 헥사보정
//  헥사보정: 헥사스탯 총레벨 × 직업배율 (기본 약 70만/Lv)
//  검증: 매화꽃여로 54,641,082 × (1+4.7) / 0.734 / 10000 ≈ 42,432
//        + 크뎀보정(1+크뎀%/100/1.35) 포함시 ≈ 63,762 (공식사이트)
// ════════════════════════════════════════════
function calcEquivStatBase(attackPower, bossPercent, ignoreDef, bossDef, critDmg){
  const atk = attackPower||0;
  const bossMult = 1 + (bossPercent||0)/100;
  const def = ignoreDef||93;
  // 남은 방어율 (실효 방어율)
  const remainDef = 1 - (bossDef/100)*(1-def/100);
  // 크뎀 보정: 기본크뎀 35%, 추가크뎀 반영 (1.35 + critDmg/100)
  const critMult = (1.35 + (critDmg||0)/100) / 1.35;
  return atk * bossMult / Math.max(remainDef, 0.01) * critMult;
}

function calcEquivStat(statList, attackPower, bossPercent, hexaStat, ignoreDef){
  const base380 = calcEquivStatBase(attackPower, bossPercent, ignoreDef, 380, 0);
  const hexaBonus = (hexaStat||0) * 70 * 10000;
  return Math.round((base380 + hexaBonus) / 10000);
}

function calcAllEquiv(attackPower, bossPercent, hexaStat, ignoreDef, combatPower, critDmg){
  const base300 = calcEquivStatBase(attackPower, bossPercent, ignoreDef, 300, critDmg);
  const base380 = calcEquivStatBase(attackPower, bossPercent, ignoreDef, 380, critDmg);
  return {
    combat: combatPower||0,                  // 인게임 전투력
    e300:   Math.round(base300 / 10000),     // 환산(300) ← 보스300 기준
    e380:   Math.round(base380 / 10000),     // 환산(380) ← 보스380 기준 (메인)
    hexaLv: hexaStat||0,                     // 헥사스탯 총레벨 (참고용)
    // h380은 직업별 헥사 효율 차이로 정확 계산 불가 → e380으로 대체
    h380:   Math.round(base380 / 10000),
  };
}

function getBossFeasibility(equivStat, bossId, memberCount){
  const th = BOSS_THRESHOLDS[bossId];
  if(!th) return null;
  const mode = memberCount <= 1 ? 'solo' : 'party';
  const t = th[mode];
  if(equivStat >= t.easy) return 'easy';
  if(equivStat >= t.ok)   return 'ok';
  return 'no';
}

// members 구조: rooms/{code}/members/{uid}/
//   nickname, chars: { charId: { charName, charClass, charLevel, charImage,
//     charWorld, statList, attackPower, bossPercent, hexaStat, equivStat } }

async function registerChar(){
  const name=document.getElementById('charNameInput').value.trim();
  const errEl=document.getElementById('charErr');
  errEl.textContent='';
  if(!name){errEl.textContent='캐릭터명을 입력해주세요';return;}
  const btn=document.getElementById('regBtn');
  btn.disabled=true;
  btn.innerHTML='<span class="spin"></span>조회중';
  try{
    const BASE='/api/nexon/maplestory/v1';
    const H={};  // API Key는 서버에서 자동 적용
    // ocid
    const oRes=await fetch(`${BASE}/id?character_name=${encodeURIComponent(name)}`,{headers:H});
    if(!oRes.ok) throw new Error('캐릭터를 찾을 수 없습니다');
    const {ocid}=await oRes.json();

    // 날짜 fallback: 어제 → 그제 순으로 시도 (API는 전날 기준 제공)
    let dt=yesterday(1);
    let iResTest=await fetch(`${BASE}/character/basic?ocid=${ocid}&date=${dt}`,{headers:H});
    if(!iResTest.ok){ dt=yesterday(2); iResTest=await fetch(`${BASE}/character/basic?ocid=${ocid}&date=${dt}`,{headers:H}); }
    if(!iResTest.ok) throw new Error('기본 정보 조회 실패 (최근 접속 이력 없음)');
    const info=await iResTest.json();

    // 스탯 + 헥사스탯 + 헥사코어 병렬 조회
    const [sRes, hStatRes, hMatRes] = await Promise.all([
      fetch(`${BASE}/character/stat?ocid=${ocid}&date=${dt}`,{headers:H}),
      fetch(`${BASE}/character/hexamatrix-stat?ocid=${ocid}&date=${dt}`,{headers:H}),
      fetch(`${BASE}/character/hexamatrix?ocid=${ocid}&date=${dt}`,{headers:H}),
    ]);

    // 스탯 파싱 (실제 API 키값 기준)
    let statList=[], statAttack=0, bossPercent=0;
    if(sRes.ok){
      const sd=await sRes.json();
      statList = sd.final_stat||[];
      const sm={};
      statList.forEach(s=>{
        const k=(s.stat_name||s.stat_type||'').trim();
        const v=parseFloat(s.stat_value)||0;
        sm[k]=v;
      });
      // '최대 스탯공격력' = 이미 스탯×공마가 곱해진 최종 스탯공격력 수치
      // 마법사는 '최대 스탯마력' 사용
      statAttack = Math.max(
        sm['최대 스탯공격력']||0,
        sm['최대 스탯마력']  ||0
      );
      bossPercent = sm['보스 몬스터 데미지']||sm['보스몬스터 데미지']||
                   sm['보스 데미지']||0;
    }
    // attackPower 변수명 유지 (하위 호환)
    const attackPower = statAttack;
    const ignoreDef = (() => {
      const sm2={};
      statList.forEach(s=>{ sm2[(s.stat_name||s.stat_type||'').trim()]=parseFloat(s.stat_value)||0; });
      return sm2['방어율 무시']||0;
    })();

    // 헥사스탯 자동 조회 (키값 여러 형태 커버)
    let hexaStatData=[], hexaStatTotal=0;
    if(hStatRes.ok){
      const hsd=await hStatRes.json();
      // API 응답 키값: character_hexa_stat_core 또는 character_hexa_stat_core_2
      hexaStatData = hsd.character_hexa_stat_core||hsd.hexa_stat_core||[];
      hexaStatTotal = hexaStatData.reduce((sum,core)=>{
        // 레벨 키값: stat_level 또는 main_stat_level
        const lv1 = core.stat_level||core.main_stat_level||0;
        const lv2 = core.stat_level2||core.sub_stat_level_1||0;
        const lv3 = core.stat_level3||core.sub_stat_level_2||0;
        return sum+lv1+lv2+lv3;
      },0);
    }

    // 헥사코어(6차 강화) 자동 조회 (키값 여러 형태 커버)
    let hexaCoreData=[], hexaCoreTotal=0;
    if(hMatRes.ok){
      const hmd=await hMatRes.json();
      hexaCoreData = hmd.character_hexa_core_equipment||hmd.hexa_core_equipment||[];
      hexaCoreTotal = hexaCoreData.reduce((sum,core)=>{
        return sum+(core.hexa_core_level||core.core_level||0);
      },0);
    }

    const charId='c'+Date.now().toString(36);
    const hexaStat = hexaStatTotal;
    const allEquiv=calcAllEquiv(attackPower, bossPercent, hexaStat, ignoreDef, combatPower, critDmg||0);
    const equivStat=allEquiv.e380;
    // 디버그 로그 (F12 콘솔에서 확인)
    console.log('[캐릭터 등록]', {
      charName: info.character_name,
      attackPower, bossPercent,
      hexaStatTotal, hexaCoreTotal,
      equivStat,
      statSample: statList.slice(0,5)
    });

    // 내 멤버 데이터 가져와서 chars에 추가
    const existing=await fbGet(`rooms/${roomCode}/members/${myUid}`)||{};
    const chars=existing.chars||{};
    chars[charId]={
      charName:info.character_name||name,
      charClass:info.character_class||'-',
      charLevel:info.character_level||0,
      charImage:info.character_image||'',
      charWorld:info.world_name||'-',
      statList, attackPower:statAttack, bossPercent, ignoreDef, combatPower, allEquiv,
      hexaStat,
      hexaStatTotal,
      hexaCoreTotal,
      hexaStatData: hexaStatData.slice(0,5),
      hexaCoreData:  hexaCoreData.slice(0,5),
      equivStat,
    };
    await fbSet(`rooms/${roomCode}/members/${myUid}`,{
      ...existing,
      nickname:myNick,
      chars,
    });
    document.getElementById('charNameInput').value='';
    const hexaMsg = hexaStatTotal>0 ? ` (헥사스탯 Lv.${hexaStatTotal}, 6차코어 Lv.${hexaCoreTotal})` : '';
    toast('✅ '+(info.character_name||name)+'이(가) 추가됐어요!'+hexaMsg);
  }catch(e){errEl.textContent='⚠ '+e.message;}
  finally{btn.disabled=false;btn.textContent='추가';}
}

async function deleteChar(uid, charId){
  const existing=await fbGet(`rooms/${roomCode}/members/${uid}`)||{};
  const chars=existing.chars||{};
  delete chars[charId];
  await fbSet(`rooms/${roomCode}/members/${uid}`,{...existing,chars});
  toast('🗑 캐릭터가 삭제됐어요');
}

async function refreshChar(uid, charId, charName){
  if(!charName){toast('캐릭터명이 없어 새로고침할 수 없어요');return;}
  const btn = document.querySelector(`#cc-${charId} .char-del-btn`);
  toast('🔄 '+charName+' 데이터 새로고침 중...');
  try{
    const BASE='/api/nexon/maplestory/v1';
    const H={};
    const oRes=await fetch(`${BASE}/id?character_name=${encodeURIComponent(charName)}`,{headers:H});
    if(!oRes.ok) throw new Error('캐릭터를 찾을 수 없습니다');
    const {ocid}=await oRes.json();
    let dt=yesterday(1);
    let iResTest=await fetch(`${BASE}/character/basic?ocid=${ocid}&date=${dt}`,{headers:H});
    if(!iResTest.ok){ dt=yesterday(2); iResTest=await fetch(`${BASE}/character/basic?ocid=${ocid}&date=${dt}`,{headers:H}); }
    if(!iResTest.ok) throw new Error('조회 실패');
    const info=await iResTest.json();
    const [sRes,hStatRes,hMatRes]=await Promise.all([
      fetch(`${BASE}/character/stat?ocid=${ocid}&date=${dt}`,{headers:H}),
      fetch(`${BASE}/character/hexamatrix-stat?ocid=${ocid}&date=${dt}`,{headers:H}),
      fetch(`${BASE}/character/hexamatrix?ocid=${ocid}&date=${dt}`,{headers:H}),
    ]);
    const sm={};
    let statList=[];
    if(sRes.ok){
      const sd=await sRes.json();
      statList=sd.final_stat||[];
      statList.forEach(s=>{ sm[(s.stat_name||s.stat_type||'').trim()]=parseFloat(s.stat_value)||0; });
    }
    const statAttack=Math.max(sm['최대 스탯공격력']||0, sm['최대 스탯마력']||0);
    const bossPercent=sm['보스 몬스터 데미지']||sm['보스몬스터 데미지']||0;
    let hexaStatTotal=0, hexaCoreTotal=0, hexaStatData=[], hexaCoreData=[];
    if(hStatRes.ok){
      const hsd=await hStatRes.json();
      hexaStatData=hsd.character_hexa_stat_core||[];
      hexaStatTotal=hexaStatData.reduce((s,c)=>s+(c.stat_level||c.main_stat_level||0)+(c.stat_level2||c.sub_stat_level_1||0)+(c.stat_level3||c.sub_stat_level_2||0),0);
    }
    if(hMatRes.ok){
      const hmd=await hMatRes.json();
      hexaCoreData=hmd.character_hexa_core_equipment||[];
      hexaCoreTotal=hexaCoreData.reduce((s,c)=>s+(c.hexa_core_level||c.core_level||0),0);
    }
    const hexaStat=hexaStatTotal;
    const ignoreDef2=sm['방어율 무시']||0;
    const critDmg2=sm['크리티컬 데미지']||sm['크리티컬데미지']||0;
    const combatPower2=sm['전투력']||0;
    const allEquiv=calcAllEquiv(statAttack,bossPercent,hexaStat,ignoreDef2,combatPower2,critDmg2);
    const equivStat=allEquiv.e380;
    const existing=await fbGet(`rooms/${roomCode}/members/${uid}`)||{};
    const chars=existing.chars||{};
    if(chars[charId]){
      chars[charId]={...chars[charId],
        charName:info.character_name||charName,
        charClass:info.character_class||'-',
        charLevel:info.character_level||0,
        charImage:info.character_image||'',
        charWorld:info.world_name||'-',
        statList, attackPower:statAttack, bossPercent, ignoreDef,
        hexaStat, hexaStatTotal, hexaCoreTotal,
        hexaStatData:hexaStatData.slice(0,5),
        hexaCoreData:hexaCoreData.slice(0,5),
        equivStat,
      };
      await fbSet(`rooms/${roomCode}/members/${uid}`,{...existing,chars});
      toast('✅ '+charName+' 새로고침 완료! 환산주스탯: '+equivStat.toLocaleString()+'만');
    }
  }catch(e){toast('⚠ 새로고침 실패: '+e.message);}
}

function renderBossList(){
  const list=document.getElementById('bossList');
  if(!list)return;
  list.innerHTML='';
  document.getElementById('tabW')?.classList.toggle('on',bossTab==='weekly');
  document.getElementById('tabM')?.classList.toggle('on',bossTab==='monthly');
  const pool=[...BOSSES.filter(b=>b.cycle===bossTab)].sort((a,b)=>b.meso-a.meso);
  const top=pool.filter(b=>b.meso>=500_000_000);
  const mid=pool.filter(b=>b.meso>=50_000_000&&b.meso<500_000_000);
  const low=pool.filter(b=>b.meso<50_000_000);
  function sec(lbl,bosses){
    if(!bosses.length)return;
    const l=document.createElement('div');
    l.className='boss-sec-lbl';l.textContent=lbl;list.appendChild(l);
    const g=document.createElement('div');g.className='boss-grid';
    bosses.forEach(b=>{
      const item=document.createElement('div');
      item.className='boss-item'+(checked.has(b.id)?' on':'');
      item.onclick=()=>{checked.has(b.id)?checked.delete(b.id):checked.add(b.id);renderBossList();};
      item.innerHTML=`
        <div class="boss-chk">${checked.has(b.id)?'✓':''}</div>
        <div class="boss-lbl">
          <div class="boss-nm">${b.name}</div>
          <div class="boss-ms">${fmtShort(b.meso)}</div>
        </div>
        <div class="diff ${b.diff}">${DL[b.diff]}</div>`;
      g.appendChild(item);
    });
    list.appendChild(g);
  }
  sec('🔴 고급 (5억+)',top);
  sec('🟡 중급 (5천만~5억)',mid);
  sec('🟢 일반 (~5천만)',low);
  const total=[...checked].reduce((s,id)=>s+(BOSSES.find(b=>b.id===id)?.meso||0),0);
  document.getElementById('weekTotal').textContent=total>0?fmtMeso(total)+' 메소':'0 메소';
  document.getElementById('selCount').textContent=checked.size+'개 선택';
}

function swTab(t){bossTab=t;renderBossList();}
function selAll(v){
  BOSSES.filter(b=>b.cycle===bossTab).forEach(b=>v?checked.add(b.id):checked.delete(b.id));
  renderBossList();
}

function onTInput(){
  const t=parseFloat(document.getElementById('targetInput').value)||0;
  document.getElementById('targetHint').textContent=t>0?fmtMeso(t*1e8):'';
}

function calc(){
  const tB=parseFloat(document.getElementById('targetInput').value);
  const cB=parseFloat(document.getElementById('currentInput').value)||0;
  if(!tB||tB<=0){toast('목표 메소를 입력해주세요');return;}
  const weekly=[...checked].reduce((s,id)=>s+(BOSSES.find(b=>b.id===id)?.meso||0),0);
  if(!weekly){toast('보스를 하나 이상 선택해주세요');return;}
  const target=tB*1e8,current=cB*1e8,remain=Math.max(0,target-current);
  const weeks=remain<=0?0:Math.ceil(remain/weekly);
  const box=document.getElementById('resultBox');
  box.style.display='block';
  document.getElementById('resultW').textContent=remain<=0?'🎉 달성!':weeks+'주';
  document.getElementById('resultSub').textContent=remain<=0?'이미 목표를 달성했습니다!':
    `약 ${Math.floor(weeks/4.33)}개월 ${weeks%4}주 소요 예상`;
  const pct=Math.min(100,(current/target)*100);
  document.getElementById('progFill').style.width=pct.toFixed(1)+'%';
  document.getElementById('resultStats').innerHTML=[
    ['주간 수익',fmtShort(weekly)],
    ['목표',fmtShort(target)],
    ['현재',fmtShort(current)],
    ['남은',fmtShort(remain)],
    ['달성률',pct.toFixed(1)+'%'],
  ].map(([l,v])=>`<div class="rs-item"><div class="rs-val">${v}</div><div class="rs-lbl">${l}</div></div>`).join('');
  box.scrollIntoView({behavior:'smooth',block:'nearest'});
}

// ════════════════════════════════════════════
//  UTILS
// ════════════════════════════════════════════
function toHalfWidth(s){
  // 전각 숫자/콜론을 반각으로 변환
  return s.replace(/[０-９：]/g, c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0))
           .replace(/:/g,':');
}

function fmtMeso(n){
  if(n>=1e12)return(n/1e12).toFixed(1)+'조';
  if(n>=1e8) return Math.floor(n/1e8)+'억 '+Math.floor((n%1e8)/1e4).toLocaleString()+'만';
  if(n>=1e4) return Math.floor(n/1e4).toLocaleString()+'만';
  return n.toLocaleString();
}
function fmtShort(n){
  if(n>=1e12)return(n/1e12).toFixed(2)+'조';
  if(n>=1e8) return(n/1e8).toFixed(1)+'억';
  if(n>=1e4) return(n/1e4).toFixed(0)+'만';
  return n.toLocaleString();
}
function fmtCP(n){
  // 전투력 표기 (만 단위)
  if(!n) return '-';
  if(n>=100000000) return (n/100000000).toFixed(0)+'억만';
  if(n>=10000) return Math.floor(n/10000).toLocaleString()+'만';
  return n.toLocaleString();
}

function fmtDate(d){
  return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function yesterday(offset=1){const d=new Date();d.setDate(d.getDate()-offset);return fmtDate(d);}

// ── 테마 토글 ──
function toggleTheme(){
  const isLight=document.body.classList.toggle('light');
  localStorage.setItem('maple_theme', isLight?'light':'dark');
  document.getElementById('themeBtn').textContent=isLight?'☀️':'🌙';
}
function initTheme(){
  const saved=localStorage.getItem('maple_theme');
  if(saved==='light'){
    document.body.classList.add('light');
    const btn=document.getElementById('themeBtn');
    if(btn) btn.textContent='☀️';
  }
}

let _toastT;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('show');
  clearTimeout(_toastT);
  _toastT=setTimeout(()=>el.classList.remove('show'),2800);
}

// close modal on backdrop click
document.getElementById('evModal').addEventListener('click',function(e){
  if(e.target===this)closeModal();
});
</script>
